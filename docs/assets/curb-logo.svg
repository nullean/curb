<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="curb-logo-title">
  <title id="curb-logo-title">Curb</title>

  <!--
    TODO: this mark was designed for the Kerf codename (a kerf is the slot a blade removes).
    The saw-slot design no longer matches the Curb name and should be redrawn before the first
    public release. The art still works visually — amber block with a slot — but the rationale
    is gone.
  -->

  <defs>
    <mask id="curb-slot">
      <rect x="0" y="0" width="64" height="64" fill="#000"/>
      <rect x="6" y="6" width="52" height="52" rx="7" fill="#fff"/>
      <!-- The cut: enters past the top edge so it reads as travelling through, and stops at y=44. -->
      <path d="M29 2 h6 v40 a3 3 0 0 1 -6 0 z" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#curb-slot)">
    <rect x="6" y="6" width="52" height="52" rx="7" fill="#F2A33C"/>
  </g>
</svg>
