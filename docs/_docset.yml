project: 'Kerf'
max_toc_depth: 2
dev_docs: true

branding:
  icon: assets/kerf-logo.svg

# Kerf is a codename. Prose refers to the product as {{product}}, so a rename is an edit here plus a
# sweep of the code samples, the CLI examples and the landing page — substitutions reach none of those.
subs:
  product: "Kerf"

toc:
  - file: index.md
  - file: why.md
  - folder: getting-started
    children:
      - file: index.md
      - file: installation.md
  - file: design-principles.md
  - folder: concepts
    children:
      - file: index.md
      - file: reflow.md
      - file: safety.md
  - folder: workflow
    children:
      - file: ai-native.md
      - file: msbuild.md
      - file: cleanup.md
      - file: agent-instructions.md
  - folder: why-not
    children:
      - file: index.md
      - file: csharpier.md
      - file: dotnet-format.md
      - file: rider-resharper.md
      - file: editorconfig-analyzers.md
  - folder: reference
    children:
      - file: index.md
      - file: options/index.md
  - listing: reference/options
    glob: "**/*.md"
    groups: [core, new-lines, indentation, spacing, wrapping, blank-lines, expression-bodies, usings, modifiers-and-braces, trailing-commas, suppression]
    sort: asc
    visual: groups
    island: true
  - folder: contribute
    children:
      - file: layout-decisions.md
      - file: formatter-comparison.md
