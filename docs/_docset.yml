project: 'Curb'
max_toc_depth: 2
dev_docs: true

branding:
  icon: images/curb-mark.svg
  favicon: images/png/curb-mark-32.png
  og-image: images/png/curb-lockup-704x384.png
  apple-touch-icon: images/png/curb-mark-180.png

# Prose uses {{product}} for the name so the codename can be changed in one place.
# Substitutions do not reach code samples, CLI examples, or the landing page.
subs:
  product: "Curb"

toc:
  - file: index.md
  - file: why.md
  - folder: getting-started
    children:
      - file: index.md
      - file: installation.md
  - folder: design-principles
    children:
      - file: index.md
      - file: conformance.md
      - file: conformance-divergences.md
      - file: performance.md
      - file: reflow.md
      - file: safety.md
      - file: ai-native.md
      - file: existing-tooling.md
      - file: syntax-and-semantic.md
  - folder: workflow
    children:
      - file: integrations.md
      - file: msbuild.md
      - file: cleanup.md
      - file: agent-instructions.md
  - folder: why-not
    children:
      - file: index.md
      - file: csharpier.md
      - file: dotnet-format.md
      - file: rider-resharper.md
      - file: editorconfig-analyzers.md
  - listing: reference
    glob: "**/*.md"
    groups: [core, new-lines, indentation, spacing, wrapping, blank-lines, expression-bodies, usings, modifiers-and-braces, trailing-commas, suppression]
    sort: asc
    visual: groups
    island: false
  - file: known-limitations.md
  - folder: benchmarks
    children:
      - file: index.md
      - file: churn.md
