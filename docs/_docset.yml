project: 'Kerf'
max_toc_depth: 2
dev_docs: true

branding:
  icon: assets/kerf-logo.svg

# Kerf is a codename. Prose refers to the product as {{product}}, so a rename is an edit here plus a
# sweep of the code samples, the CLI examples and the landing page — substitutions reach none of those.
subs:
  product: "Kerf"

toc:
  - file: index.md
  - file: why.md
  - folder: getting-started
    children:
      - file: index.md
      - file: installation.md
  - folder: design-principles
    children:
      - file: index.md
      - file: conformance.md
      - file: performance.md
      - file: reflow.md
      - file: safety.md
      - file: ai-native.md
      - file: existing-tooling.md
      - file: syntax-and-semantic.md
  - folder: workflow
    children:
      - file: integrations.md
      - file: msbuild.md
      - file: cleanup.md
      - file: agent-instructions.md
  - folder: why-not
    children:
      - file: index.md
      - file: csharpier.md
      - file: dotnet-format.md
      - file: rider-resharper.md
      - file: editorconfig-analyzers.md
  - listing: reference
    glob: "**/*.md"
    groups: [core, new-lines, indentation, spacing, wrapping, blank-lines, expression-bodies, usings, modifiers-and-braces, trailing-commas, suppression]
    sort: asc
    visual: groups
    island: false
  - folder: contribute
    children:
      - file: formatter-comparison.md
      - file: known-limitations.md
