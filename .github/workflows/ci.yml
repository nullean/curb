name: Always be deploying

on:
  # Weekly full run — all five AOT legs and every corpus gate. Sunday 04:00 UTC, quiet time.
  schedule:
    - cron: '0 4 * * 0'
  # Manual trigger for the same. Also lets you force a full run on a branch before tagging.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'NOTICE'
  push:
    paths-ignore:
      - 'README.md'
      - 'NOTICE'
    branches:
      - main
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# ── What runs when ──────────────────────────────────────────────────────────────
#
# The repository is public, so GitHub-hosted runners cost nothing. What the gating below buys is wall-clock
# time on a pull request, and fewer jobs queued for the organisation's concurrent runners.
#
#   1. The AOT matrix. On pull requests only linux-x64 runs (AOT must link and execute; that is proved);
#      the other four RIDs get the same proof on every push to main, where packages are produced.
#
#   2. The corpus gates. The fast ones run on every trigger, in "Corpus and conformance" (the required
#      check). The rest are correct and belong in CI, but do not need to run on every commit: they run on
#      tag pushes, the weekly schedule and workflow_dispatch (CURB_FULL_GATES). Run one after another in a
#      single job they took 54 minutes; split into parallel jobs a full run takes ~17 (measured on one run each).
#
#      Steps gated on CURB_FULL_GATES, in the corpus job:
#        - Conformance with dotnet format              (~17 s, no-width path)
#        - Conformance with a width of 120 columns     (~13 s, non-default width)
#        - Conformance with the preservation opt-out   (~13 s, non-default mode)
#        - Churn, all three configurations             (~9 s, reported not gated)
#        - Speed and allocations                       (~5 s, allocation ratio gate; reuses CURB_EXE)
#      Jobs of their own, full gates only, in parallel with the corpus job:
#        - Cleaning a real solution leaves it building (cleanupconformance, ~3 min job)
#        - IDE0055 under a real build, four shards     (verifyexpectationside0055, 7-13 min each;
#          runner speed varied more than shard size did)
#
#      Step NOT gated (stays on every trigger):
#        - Conformance with a width (deterministic, the default)
#          This is the primary correctness claim, held at its floor on the
#          default path. It must not be conditional.
#
# The weekly run is a strict superset of a push-to-main run. A tag push is also full, so the gates have run
# on the commit being released, and the release job publishes nothing until every one of them has passed.
#
# Every job that needs the corpus gets it from `./build.sh clonecorpus`, so where it comes from is decided in
# one place (materialiseCorpus in build/scripts/Targets.fs). It is generated, by tools/Nullean.Curb.CorpusGenerator:
# a solution that builds, ~10 MB of C# from templates, the test suite's ~1,200 expectation sources as snippets,
# every file in an untidy layout drawn from a fixed seed. The same seed and the same test suite give a
# byte-identical corpus, so a number below moves only when Curb, the tests or the generator do. Nothing is
# fetched. `--corpus-source docs-builder` still clones elastic/docs-builder, the corpus these gates ran against
# until the generated one replaced it, for comparing the two by hand.
#
# The floors below are the generated corpus's own, not the 100% docs-builder held: it is written to be untidy,
# and Curb disagrees with dotnet format on some of what it finds. Each floor sits a few files under the measured
# number, so a new test case whose snippet lands on a known disagreement does not fail an unrelated change.

env:
  CURB_FULL_GATES: >-
    ${{ github.event_name == 'schedule'
     || github.event_name == 'workflow_dispatch'
     || startsWith(github.ref, 'refs/tags/') }}

jobs:

  # ── AOT pack matrix ─────────────────────────────────────────────────────────
  # Native AOT can only compile for the OS/arch it runs on, so each leg compiles
  # its own RID, smoke-tests the binary, and packs the per-RID tool package.
  #
  # On pull requests, only the linux-x64 leg runs. All five run on push, tags,
  # weekly, and workflow_dispatch — wherever packages are produced or the full
  # surface is exercised.
  aot-pack:
    timeout-minutes: 20
    strategy:
      fail-fast: false   # a preempted arm runner must not cancel the whole matrix
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"rid":"linux-x64","runner":"ubuntu-latest"}]'
          || '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"},{"rid":"osx-arm64","runner":"macos-latest"}]') }}

    runs-on: ${{ matrix.runner }}
    name: AOT pack (${{ matrix.rid }})

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Gate: the engine must link and run under AOT before anything gets packed.
      - name: AOT smoke test — ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish examples/curb-aot-smoketest -c Release -r ${{ matrix.rid }}
          EXT=""
          [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          BINARY=".artifacts/publish/curb-aot-smoketest/release_${{ matrix.rid }}/curb-aot-smoketest${EXT}"
          OUTPUT=$("$BINARY")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "^OK:" || (echo "ERROR: AOT smoke test failed" && exit 1)

      # Packing WITH -r emits only this RID's package. The root package and the portable 'any'
      # fallback come from the coordinating build job instead — see generatePackages in
      # build/scripts/Targets.fs for why the per-RID packages must be built here, on a matching
      # runner, rather than all at once on one machine.
      - name: Pack native-AOT tool for ${{ matrix.rid }}
        run: dotnet pack src/Nullean.Curb.Cli/Nullean.Curb.Cli.csproj -c Release -r ${{ matrix.rid }} -o build/output
        shell: bash

      - name: Report native binary size
        shell: bash
        run: |
          EXT=""
          [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          BINARY=$(find .artifacts -name "curb${EXT}" -type f | head -1)
          [[ -n "$BINARY" ]] && ls -la "$BINARY" || echo "(no native binary found)"

      # Container image, linux-x64 only for now — the platform every GitHub-hosted Linux runner
      # already matches. No --push here and no registry login on this leg, so this only proves the
      # container build itself still works: AOT compiles, the chiseled base image resolves, and the
      # SDK's container tooling produces an image in the local Docker daemon. The real push to
      # ghcr.io happens once, in the build job below, which does pass --push.
      - name: Build container image (no push)
        if: matrix.rid == 'linux-x64'
        run: ./build.sh publishcontainers -s true
        shell: bash

      - name: Report container image size
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: docker images nullean/curb --format '{{.Tag}}\t{{.Size}}'

      - name: Upload per-RID package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ matrix.rid }}
          path: build/output/*.nupkg
          if-no-files-found: error

  # ── Corpus and conformance ──────────────────────────────────────────────────
  # Every bug this project has had was found here rather than by the unit tests:
  # dropped tokens, welded identifiers, indentation drift, non-idempotent output.
  # Until this ran in CI it gated nothing.
  corpus:
    runs-on: ubuntu-latest
    name: Corpus and conformance
    # The two slow full gates have jobs of their own below, so this one takes about as long on every trigger.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: ./build.sh build -s true

      # Once, for every step below that runs the CLI: the corpus checks call it directly, and the build
      # targets (conformance, churn, perf, the MSBuild smoke tests) pick it up from CURB_EXE instead of each
      # paying a `dotnet run` up-to-date check or an AOT publish of their own. It is also the binary that
      # ships, where `dotnet run` was the JIT build.
      - name: Publish the native CLI
        run: |
          dotnet publish src/Nullean.Curb.Cli -c Release -r linux-x64
          echo "CURB_EXE=$GITHUB_WORKSPACE/.artifacts/publish/Nullean.Curb.Cli/release_linux-x64/curb" >> "$GITHUB_ENV"

      # The generator dumps its snippets by running the test suite, and with CI=true the suite's F# tests fail
      # rather than skip when the Fantomas they pin is missing.
      - name: Restore the Fantomas the F# tests run against
        run: dotnet tool restore --tool-manifest tests/Nullean.Curb.Tests/Cli/FSharp/Fixture/dotnet-tools.json

      # After the build, which the generator's `dotnet run` steps then find up to date. It also fails if Curb
      # would leave most of the generated C# alone: on Curb's own output every gate below passes for free.
      - name: Generate the corpus
        run: ./build.sh clonecorpus -s true --corpus /tmp/corpus

      # Both verifiers on every file, and formatting must not fail or produce
      # source that no longer parses.
      - name: Verify the corpus formats safely
        run: |
          "$CURB_EXE" check /tmp/corpus | tee result.txt
          grep -qE '0 failed, 0 unparsable' result.txt \
            || (echo "::error::corpus reported failures" && exit 1)

      - name: Verify formatting is idempotent
        run: |
          cp -R /tmp/corpus /tmp/pass1
          "$CURB_EXE" format /tmp/pass1 >/dev/null
          cp -R /tmp/pass1 /tmp/pass2
          "$CURB_EXE" format /tmp/pass1 >/dev/null
          diff -rq /tmp/pass2 /tmp/pass1 \
            || (echo "::error::formatting is not idempotent" && exit 1)

      # The cache is only ever allowed to skip work that was provably unnecessary, and the way that goes
      # wrong is silently: an over-eager cache reports a clean corpus it never looked at, and a cache that
      # never hits looks exactly like one that is working. Both runs are asserted for that reason.
      #
      # Over the formatted copy, not the corpus: Curb only caches a file that already formats to itself, and
      # the generated corpus is untidy on purpose, so on the corpus itself the warm run would hit a handful of
      # files and prove little.
      - name: Verify the cache skips only unchanged files
        run: |
          cp -R /tmp/pass1 /tmp/cached
          "$CURB_EXE" check /tmp/cached --cache /tmp/curb.cache | tee cold.txt
          ! grep -q 'from cache' cold.txt \
            || (echo "::error::the first run cannot have served anything from an empty cache" && exit 1)
          "$CURB_EXE" check /tmp/cached --cache /tmp/curb.cache | tee warm.txt
          grep -qE '\([0-9]+ from cache\)' warm.txt \
            || (echo "::error::the cache served nothing on a second run over an unchanged corpus" && exit 1)

      # The product claim, as a number that must not go down: Curb's output is a fixed point of dotnet format.
      #
      # Measured 82.95% (1523/1836). Most of what is left is one defect: converting space indentation to tabs
      # re-indents only the first line of a /// doc comment (168 files). The rest are continuation lines Curb
      # indents differently on untidy input: multi-dimensional array initializers, `select new { }`, tuple
      # patterns in switch arms, `with` initializers, and leading comments. docs-builder held 100% because
      # its authors had already formatted it.
      # Gated weekly: the no-width conformance path is slower to regress and adds ~10 s per run.
      - name: Conformance with dotnet format
        if: env.CURB_FULL_GATES == 'true'
        run: ./build.sh conformance -s true --corpus /tmp/corpus --minimum 82.7

      # The corpus sets max_line_length = 140, so --reflow is the *default* path for it: a width selects
      # deterministic layout as well as the column. Measured 84.97% (1560/1836): deterministic layout has no
      # source arrangement for dotnet format to disagree with, so it is cleaner than the preserving opt-out
      # below on the same corpus. If this drops, the default is not shippable however good its churn looks.
      - name: Conformance with a width (deterministic, the default)
        run: ./build.sh conformance -s true --corpus /tmp/corpus --reflow --minimum 84.7

      # A non-default width. Measured 84.80% (1557/1836).
      # Gated weekly: a regression here shows up in the default-width gate too.
      - name: Conformance with a width of 120 columns
        if: env.CURB_FULL_GATES == 'true'
        run: ./build.sh conformance -s true --corpus /tmp/corpus --width 120 --minimum 84.5

      # The opt-out, which has to stay measurable now that a width no longer selects it. Measured 82.95%, the
      # same files as the no-width run.
      # Gated weekly: the opt-out is a non-default mode; a regression there will not affect the default path.
      - name: Conformance with the preservation opt-out
        if: env.CURB_FULL_GATES == 'true'
        run: ./build.sh conformance -s true --corpus /tmp/corpus --reflow --preserve --minimum 82.7

      # Idempotency is what the default now buys by construction rather than by measurement: layout is a
      # function of tokens and width, and tokens do not move. A failure here means something in the
      # printer is reading its own output back as intent.
      - name: Verify formatting with a width is idempotent
        run: |
          cp -R /tmp/corpus /tmp/det1
          "$CURB_EXE" format /tmp/det1 >/dev/null
          cp -R /tmp/det1 /tmp/det2
          "$CURB_EXE" format /tmp/det1 >/dev/null
          diff -rq /tmp/det2 /tmp/det1 \
            || (echo "::error::formatting is not idempotent with a width set" && exit 1)

      # Reported, not gated. Churn is the cost of adopting Curb on a repository that already has a layout. On
      # the generated corpus it is ~99.9% of files in every configuration by construction, so the file count
      # says little; the changed-line delta between the three configurations is what still moves. The
      # adoption numbers in docs/benchmarks/churn.md come from real repositories, measured by hand with
      # `./build.sh churn --corpus <checkout>`.
      # Gated weekly: these assert nothing.
      - name: Churn, all three configurations
        if: env.CURB_FULL_GATES == 'true'
        run: |
          ./build.sh churn -s true --corpus /tmp/corpus
          ./build.sh churn -s true --corpus /tmp/corpus --reflow
          ./build.sh churn -s true --corpus /tmp/corpus --reflow --preserve

      # Measures the native binary (CURB_EXE, published above), not the JIT build. On a run this short JIT
      # compilation dominates, so `dotnet run` reports several times the real cost and reads as a
      # regression that is not there. The gate is on allocations because they are deterministic;
      # wall time is reported for the trend but never asserted on a hosted runner.
      #
      # 43.3x on the generated corpus, where docs-builder measured 26.7x on the same binary. The difference is
      # verification rather than printing: untidy input moves token boundaries, so 24% of files take the second,
      # round-trip parse that docs-builder's tidy files almost never needed (0.1%).
      # Gated weekly: allocation counts are deterministic; a regression here does not go unnoticed
      # within a week, and the gate is per-commit on every full run (tag, schedule, dispatch).
      - name: Speed and allocations
        if: env.CURB_FULL_GATES == 'true'
        run: ./build.sh perf -s true --corpus /tmp/corpus --maxallocationratio 45

      # Two-sided on purpose. The sample builds clean with Curb in the way even though IDE0055 is an
      # error and its source is misformatted, and fails with those errors when Curb is bypassed. The
      # first assertion alone would pass just as well if the analysers were never running, which is
      # the shape this kind of test usually takes.
      - name: MSBuild integration runs before the compiler
        run: ./build.sh msbuildsmoketest -s true

      # The F# target, against the Fantomas the sample's manifest pins (restored from nuget.org here, so it
      # needs the network the restore above already used). There is no IDE0055 for F#, so the two sides are
      # read off the file: formatted with Curb, untouched with Curb bypassed. Between them it proves an
      # unchanged project skips the target, so no Fantomas starts, and a checking build fails with CURB0001.
      - name: MSBuild formats F# through the pinned Fantomas
        run: ./build.sh fsharpsmoketest -s true

      # Four-sided, where the formatting smoke test above needs two. Two of them are the same idea —
      # cleanup works, and the build would have failed without it. The other two exist because cleanup
      # can be wrong in ways a formatter cannot: it could silence a rule instead of fixing it, so the
      # second build's output is checked for IDE0005 rather than only its exit code; and it could rewrite
      # a repository that asked for nothing, so the sample is also built with no severity escalated and
      # the source must come out byte-identical.
      - name: Cleanup fixes what the build reported, and only that
        run: ./build.sh cleanupsmoketest -s true

      # The adversarial half. The smoke test hands cleanup a diagnostic the compiler really reported; this
      # claims every rule fires everywhere it could, so it deletes needed imports and writes `var` where the
      # type was load-bearing. Those are wrong verdicts on purpose, and the property is that a wrong verdict
      # still cannot fail verification, cannot produce a file the parser rejects, and cannot survive a second
      # pass through the node-kind gate.
      #
      # It earned its place on the first run. Four separate defects, none of which the unit tests or the
      # smoke test could reach: an insertion consumed at the first disagreement rather than at its declared
      # offset (`var` in front of a variable called `version` leaves both sides reading `v`); a zero-width
      # token, the omitted array size in `byte[]`, stealing the dropped span belonging to the `]` behind it;
      # a run of using directives removed as one range, taking the comments and `#line` directives between
      # them; and a diagnostic having some of its edits dropped for overlap while the rest were applied.
      - name: No wrong verdict damages a file
        run: ./build.sh cleanupsafety -s true --corpus /tmp/corpus

      # Every expectation the suite asserts, written out and run through dotnet format. Until this
      # existed only the corpus proved the fixed-point property; the hand-written expectations proved
      # only that Curb agrees with itself, so one written from a wrong belief would pass forever — it
      # found exactly that on its first run, an option value Roslyn rejects outright.
      #
      # Zero tolerance for an undocumented disagreement, not a floor: every case that is not a fixed
      # point of dotnet format has to be named in build/conformance-divergences.json with a reason, or
      # this fails outright. Five are documented today — see that file — a ReSharper-only key in direct
      # conflict with an IDE0055 key dotnet format enforces, two invalid-value fallback mismatches, a
      # `#pragma warning disable` region dotnet format has no concept of suppression for at all, and an
      # indentation quirk specific to combining indent_style = tab with tab_width and a forced wrap. A
      # case that is a fixed point but merely a different shape than dotnet format's own choice is not
      # gated at all — see docs/design-principles/conformance.md for why. This also gates that every
      # implemented .editorconfig key has at least one case at all (checkOptionCoverage in Targets.fs) —
      # an option catalogued as implemented with nothing exercising it is exactly how three real gaps
      # were found and left unfixed but tracked: see build/scripts/Targets.fs's checkOptionCoverage
      # exclusion list.
      - name: Expectations survive dotnet format
        run: ./build.sh verifyexpectations -s true

      # Same discipline, for curb cleanup's semantic rules against dotnet format style. Each cleanup
      # case that actually fixed something gets its own throwaway project — batching them into one would
      # make two unrelated cases both naming `class Widget` in `namespace N` a compile error rather than
      # the two independent snippets the source intended — and dotnet format style --verify-no-changes
      # says whether Curb's fix is a fixed point. One `dotnet format style` per processor at a time, each case
      # in its own directory with its own obj: 74-121 s here, where running them one after another took 109-222 s.
      - name: Cleanup expectations survive dotnet format style
        run: ./build.sh verifycleanupexpectations -s true

      # docs/reference/**/*.md is generated from OptionDescriptor.All rather than hand-maintained, so it
      # can only drift by someone changing the descriptor and forgetting to regenerate — catch that here
      # rather than in review, where a diff this size (one page per option) is easy to wave through
      # unread.
      - name: Option reference docs are up to date
        run: |
          ./build.sh options -s true
          git diff --exit-code -- docs/reference \
            || (echo "::error::docs/reference is out of date — run ./build.sh options and commit the result" && exit 1)

  # ── Full gates that need a job of their own ─────────────────────────────────
  # Both used to be steps of the corpus job, and between them took 45 of its 54 minutes. They only run on
  # full-gate triggers; the condition is CURB_FULL_GATES spelled out, because a job's `if` cannot read the
  # workflow's env.

  # The other half of cleanupsafety, and the only gate that can catch a fix which compiles but is wrong: the
  # corpus is built with one violation seeded per rule, cleaned, and built again. cleanupsafety never
  # compiles anything, so it cannot reach this.
  #
  # Measured on the generated corpus: 7,339 sites across all ten rules (the generator plants them across the
  # solution, beside the seed), 7,220 fixed, and the solution still builds, with 119 sites left, all of them
  # ones Curb declined out loud because the file has a `#if`. docs-builder gave this gate 493 sites, 483 of
  # them IDE0005. Its first run on the generated corpus found a fix that stops a build: a multi-targeted
  # project reports a site once per target framework, and the modifier went in twice (see KnownDefects in the
  # generator).
  #
  # Three things had to be forced before it measured anything, each of which made it pass while proving
  # nothing: RunAnalyzersDuringBuild, which the corpus turns off outside CI; EnforceCodeStyleInBuild as a
  # *global* property, since the SDK picks its analysers before Directory.Build.targets is read; and
  # neutralising the corpus's own `dotnet_diagnostic.IDE0005.severity = none`, because an .editorconfig
  # entry for a specific rule outranks a .globalconfig one whatever global_level says. The generated corpus
  # keeps all three traps on purpose, so the forcing stays exercised.
  cleanup-conformance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Cleaning a real solution leaves it building
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The generator dumps its snippets by running the test suite, and with CI=true the suite's F# tests fail
      # rather than skip when the Fantomas they pin is missing; the IDE0055 job below restores it for the same reason.
      - name: Restore the Fantomas the F# tests run against
        run: dotnet tool restore --tool-manifest tests/Nullean.Curb.Tests/Cli/FSharp/Fixture/dotnet-tools.json

      - name: Generate the corpus
        run: ./build.sh clonecorpus -s true --corpus /tmp/corpus

      - name: Cleaning a real solution leaves it building
        run: ./build.sh cleanupconformance -s true --corpus /tmp/corpus

  # Being a fixed point of dotnet format whitespace (verifyexpectations, in the corpus job) is not the same
  # claim as passing a real, analyzer-driven build: issue #77 was both a fixed point of dotnet format
  # whitespace AND a hard IDE0055 failure under `dotnet build -p:EnforceCodeStyleInBuild=true`, with no
  # .editorconfig escape hatch, because IDE0055's CSharpIndentBlockFormattingRule resolves indentation from
  # full block context in a way the plain whitespace rewriter never exercises.
  #
  # One project per case (batching all ~1,200 into one build turned out to have its own, much sharper
  # failure mode: a severe diagnostic anywhere in a shared compilation silently drops IDE0055 reporting for
  # every OTHER file too, and a formatter's own test suite exists specifically to exercise the unusual and
  # borderline C# shapes that trigger it). That is ~30 minutes of builds on one hosted runner, so it runs as
  # four shards. Each shard dumps the suite itself and checks the cases whose test name hashes to it; the
  # four together cover every case exactly once (see verifyExpectationsIde0055 in Targets.fs).
  ide0055:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: IDE0055 under a real build (shard ${{ matrix.shard }}/4)
    timeout-minutes: 30
    strategy:
      fail-fast: false   # one shard's failure says nothing about the other three's cases
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The gate dumps its cases by running the test suite, and with CI=true the suite's F# tests fail rather
      # than skip when the Fantomas they pin is missing. The corpus job gets it from the F# smoke test's
      # restore; this job runs nothing else, so it restores it the way the build job does.
      - name: Restore the Fantomas the F# tests run against
        run: dotnet tool restore --tool-manifest tests/Nullean.Curb.Tests/Cli/FSharp/Fixture/dotnet-tools.json

      - name: Expectations report no IDE0055 under a real build
        run: ./build.sh verifyexpectationside0055 -s true --shard ${{ matrix.shard }}/4

  # ── Managed build / test / pack (and the canary on a branch push) ───────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: aot-pack
    permissions:
      contents: write   # create GitHub release
      packages: write   # push to GitHub Packages
      issues: write     # release-notes creates labels for its categories

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/nullean/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ./build.sh build -s true

      # The tests that run the real Fantomas, through its daemon and its command line, skip where it is not
      # restored. Here it is, from the fixture manifest that pins the version they expect, and they fail
      # rather than skip when CI=true.
      - name: Restore the Fantomas the F# tests run against
        run: dotnet tool restore --tool-manifest tests/Nullean.Curb.Tests/Cli/FSharp/Fixture/dotnet-tools.json

      - name: Test
        run: ./build.sh test -s true

      - name: Generate managed packages
        if: github.event_name == 'push'
        run: ./build.sh generatepackages -s true

      - name: Download all per-RID AOT packages
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          pattern: nupkg-*
          path: build/output
          merge-multiple: true

      - name: Validate managed packages
        if: github.event_name == 'push'
        run: ./build.sh validatepackages -s true

      - name: Inspect public API changes
        if: github.event_name == 'push'
        run: ./build.sh generateapichanges -s true

      - name: Publish canary to GitHub Packages (branch push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads')
        shell: bash
        run: |
          until dotnet nuget push 'build/output/*.nupkg' \
            -k ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate \
            --no-symbols; do echo "Retrying"; sleep 1; done

      # ghcr.io/nullean/curb, matching elastic/docs-builder's own tagging: "edge" and the commit SHA on
      # every push, plus "latest", the semver and "v<major>" when this push is an exact release tag — see
      # publishContainers/containerImageTags in Targets.fs for how that split is decided. action.yml
      # picks among these tags by the ref a workflow pins. A tag's push happens in the release job below.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image (branch push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads')
        run: ./build.sh publishcontainers -s true --push

      # The packages the release job publishes are exactly the ones validated here, with the breaking-changes
      # notes the API inspection above wrote for the GitHub release body.
      - name: Hand the validated packages to the release job (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            build/output/*.nupkg
            build/output/breaking-changes-*.md
          if-no-files-found: error

  # ── Release ─────────────────────────────────────────────────────────────────
  # A tag publishes only once every gate has passed. Publishing used to hang off `build` alone, so 0.9.0
  # and 0.10.0 both went out while a corpus gate was still running and then failed. Needing the gate jobs
  # also skips this job if any of them is skipped, which on a tag none is: CURB_FULL_GATES is true.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, corpus, cleanup-conformance, ide0055]
    permissions:
      contents: write   # create GitHub release
      packages: write   # push the container image
      issues: write     # release-notes creates labels for its categories

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download the validated packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/output

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image
        run: ./build.sh publishcontainers -s true --push

      - name: Generate release notes
        run: ./build.sh generatereleasenotes -s true

      - name: Create GitHub release
        run: ./build.sh createreleaseongithub -s true --token ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to nuget.org
        run: |
          dotnet nuget push 'build/output/*.nupkg' \
            -k ${{ secrets.NUGET_ORG_API_KEY }} \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols
